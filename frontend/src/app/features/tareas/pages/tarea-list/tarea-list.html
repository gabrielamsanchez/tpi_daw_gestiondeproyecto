<div class="main-container">
    <p-toast />
    
    <div class="header-row">
        <button pButton type="button" icon="pi pi-arrow-left" class="btn-back"></button>
        <button pButton type="button" label="CERRAR SESIÓN" class="btn-dark"></button>
    </div>

    <div class="badge-wrapper">
        <div class="badge-blue">
            <div class="badge-icon-box">
                <i class="pi pi-briefcase" style="font-size: 1.8rem; color: #1e293b;"></i>
            </div>
            <div class="badge-text-box">
                <span class="badge-title">TAREAS</span>
                <span class="badge-subtitle">Gestión de proyectos</span>
            </div>
        </div>
    </div>

    <div class="table-wrapper">
        <p-table #dt 
                 [value]="tareas" 
                 dataKey="id" 
                 editMode="row" 
                 class="custom-table"
                 [columns]="cols">
            <ng-template #header>
                <tr>
                    <th class="col-nombre" style="width: 30%">Nombre Proyecto</th>
                    <th class="col-cliente" style="width: 25%">Cliente</th>
                    <th class="col-estado" style="width: 25%">Estado</th>
                    <th class="col-acciones" style="width: 20%">Acciones</th>
                </tr>
            </ng-template>
            
            <ng-template #body let-tarea let-editing="editing" let-ri="rowIndex">
                <tr [pEditableRow]="tarea">
                    
                    <td class="col-cell">
                        <p-cellEditor>
                            <ng-template #input>
                                <input pInputText type="text" [(ngModel)]="tarea.nombreProyecto" required style="width: 100%" />
                            </ng-template>
                            <ng-template #output>
                                {{ tarea.nombreProyecto }}
                            </ng-template>
                        </p-cellEditor>
                    </td>
                    
                    <td class="col-cell">
                        <p-cellEditor>
                            <ng-template #input>
                                <input pInputText type="text" [(ngModel)]="tarea.cliente" required style="width: 100%" />
                            </ng-template>
                            <ng-template #output>
                                {{ tarea.cliente }}
                            </ng-template>
                        </p-cellEditor>
                    </td>

                    <td class="col-cell text-center">
                        <p-cellEditor>
                            <ng-template #input>
                                <p-select [options]="statuses" appendTo="body" [(ngModel)]="tarea.estado" [style]="{ width: '100%' }" />
                            </ng-template>
                            <ng-template #output>
                                <p-tag [value]="getLabelEstado(tarea.estado)" [severity]="getSeverity(tarea.estado)" />
                            </ng-template>
                        </p-cellEditor>
                    </td>
                    
                    <td class="col-cell text-center">
                        <div class="flex items-center justify-center gap-2">
                            <button *ngIf="!editing" pButton pRipple type="button" pInitEditableRow icon="pi pi-pencil" (click)="onRowEditInit(tarea)" class="p-button-rounded p-button-text p-button-secondary"></button>
                            <button *ngIf="editing" pButton pRipple type="button" pSaveEditableRow icon="pi pi-check" (click)="onRowEditSave(tarea)" class="p-button-rounded p-button-text p-button-success"></button>
                            <button *ngIf="editing" pButton pRipple type="button" pCancelEditableRow icon="pi pi-times" (click)="onRowEditCancel(tarea, ri)" class="p-button-rounded p-button-text p-button-danger"></button>
                        </div>
                    </td>
                </tr>
            </ng-template>

            <ng-template #emptymessage>
                <tr>
                    <td colspan="4" class="empty-cell">
                        No se encontraron tareas o proyectos en la base de datos.
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>

    <div class="footer-row">
        <button pButton 
                type="button" 
                label="DESCARGAR" 
                (click)="dt.exportCSV()" 
                [disabled]="tareas.length === 0"
                class="btn-dark btn-download">
        </button>
        
        <span class="footer-text">
            DAW - Sistema de Gestión de Proyectos © 2026
        </span>
    </div>
</div>
