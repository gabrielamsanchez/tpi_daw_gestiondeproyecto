<div class="main-container">
  <p-toast />

  <div class="header-row">
    <app-back></app-back>
  </div>

  <div class="action-row">
    <button
      pButton
      type="button"
      label="Nuevo Cliente"
      class="btn-agregar-cliente"
      icon="pi pi-plus-circle">
    </button>
  </div>

  <div class="table-wrapper">
    <p-table
    <p-card styleClass="w-full shadow-md rounded-xl p-2">
      <p-toast />

        <div class="flex items-center justify-between mb-4">
              <div class="action-row">
                <button
                    pButton
                    type="button"
                    label="Nuevo Cliente"
                    class="btn-agregar-cliente"
                    icon="pi pi-plus-circle"
                    (click)=" crearNuevoCliente()"
                    >
                </button>
              </div>
    </div>

      <div class="w-full overflow-x-auto">
        <p-table
          [value]="clientes"
          dataKey="id"
          editMode="row"
          class="custom-table"
          [tableStyle]="{ 'width': '100%', 'border-collapse': 'collapse' }">

          <ng-template #header>
            <tr>
              <th style="background-color: #e0f2fe; color: #334155; text-align: center; border: 1px solid #cbd5e1; padding: 12px; font-weight: 600;">Nombre</th>
              <th style="background-color: #ffedd5; color: #334155; text-align: center; border: 1px solid #cbd5e1; padding: 12px; font-weight: 600;">Estado</th>
              <th style="background-color: #bbf7d0; color: #334155; text-align: center; border: 1px solid #cbd5e1; padding: 12px; font-weight: 600;">Teléfono</th>
              <th style="background-color: #ffedd5; color: #334155; text-align: center; border: 1px solid #cbd5e1; padding: 12px; font-weight: 600;">Correo</th>
              <th style="background-color: #bbf7d0; color: #334155; text-align: center; border: 1px solid #cbd5e1; padding: 12px; width: 15%; font-weight: 600;">Acciones</th>
            </tr>
          </ng-template>

          <ng-template #body let-cliente let-editing="editing" let-ri="rowIndex">
            <tr [pEditableRow]="cliente">

              <td class="col-cell">
                <p-cellEditor>
                  <ng-template #input>
                    <input pInputText type="text" [(ngModel)]="cliente.nombre" required style="width: 100%" />
                  </ng-template>
                  <ng-template #output>
                    {{ cliente.nombre }}
                  </ng-template>
                </p-cellEditor>
              </td>

              <td class="col-cell text-center">
                <p-cellEditor>
                  <ng-template #input>
                    <p-select [options]="estados" appendTo="body" [(ngModel)]="cliente.estado" [style]="{ width: '100%' }" />
                  </ng-template>
                  <ng-template #output>
                    <p-tag *ngIf="cliente.estado" [value]="cliente.estado" />
                  </ng-template>
                </p-cellEditor>
              </td>

              <td class="col-cell text-center">
                <div class="flex items-center justify-center gap-2">
               <td style="border: 1px solid #cbd5e1; padding: 10px; text-align: center;">
                <p-cellEditor>
                  <ng-template #input>
                    <input pInputText type="text" [(ngModel)]="cliente.telefono" class="w-full" />
                  </ng-template>
                  <ng-template #output>
                    {{ cliente.telefono }}
                  </ng-template>
                </p-cellEditor>
              </td>

               <td style="border: 1px solid #cbd5e1; padding: 10px; text-align: center;">
                <p-cellEditor>
                  <ng-template #input>
                    <input pInputText type="text" [(ngModel)]="cliente.correo" class="w-full" />
                  </ng-template>
                  <ng-template #output>
                    {{ cliente.correo }}
                  </ng-template>
                </p-cellEditor>
              </td>

              <td style="border: 1px solid #cbd5e1; padding: 10px; text-align: center;">
                <div class="flex justify-content-center align-items-center gap-3">

                  <ng-container *ngIf="!editing">
                    <button
                      pButton
                      type="button"
                      pInitEditableRow
                      icon="pi pi-pencil"
                      (click)="onRowEditInit(cliente)"
                      class="p-button-rounded p-button-text p-button-secondary"></button>

                    <p-button
                      icon="pi pi-times"
                      severity="danger"
                      [rounded]="true"
                      [text]="true"
                      (click)="onRowEditCancel(cliente, ri)"></p-button>
                  </ng-container>

                  <ng-container *ngIf="editing">
                    <button
                      pButton
                      type="button"
                      pSaveEditableRow
                      icon="pi pi-check"
                      (click)="onRowEditSave(cliente)"
                      class="p-button-rounded p-button-text p-button-success"></button>
                    <button
                      pButton
                      type="button"
                      pCancelEditableRow
                      icon="pi pi-times"
                      (click)="onRowEditCancel(cliente, ri)"
                      class="p-button-rounded p-button-text p-button-danger"></button>
                  </ng-container>

                </div>
              </td>
            </tr>
          </ng-template>

          <ng-template #emptymessage>
            <tr>
              <td colspan="3" class="empty-cell">
                No se encontraron clientes.
              </td>
            </tr>
          </ng-template>
    </p-table>
  </div>
</div>
